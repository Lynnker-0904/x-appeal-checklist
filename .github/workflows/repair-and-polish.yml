name: Repair and polish app

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-and-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair app and polish UI
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s

          replacements = {
              "function addOAuth(){data.oauth.push({name:'',dev:'',date:'',permission:'',known:'',used:'',revoked:'',note:''});if(persist())renderRecords();}":
              "function addOAuth(){data.oauth.push({name:'',dev:'',date:'',permission:'',known:'',used:'',revoked:'',note:''});if(persist()){renderRecords();editRecord('oauth',data.oauth.length-1)}}",
              "function addTimeline(){data.timeline.push({date:'',title:'',type:'',detail:'',source:''});if(persist())renderRecords();}":
              "function addTimeline(){data.timeline.push({date:'',title:'',type:'',detail:'',source:''});if(persist()){renderRecords();editRecord('timeline',data.timeline.length-1)}}",
              "function addEvidence(){data.evidenceList.push({name:'',type:'',location:'',event:'',note:''});if(persist())renderRecords();}":
              "function addEvidence(){data.evidenceList.push({name:'',type:'',location:'',event:'',note:''});if(persist()){renderRecords();editRecord('evidenceList',data.evidenceList.length-1)}}",
          }
          for a,b in replacements.items():
              if a not in s:
                  raise SystemExit('Expected function not found: ' + a[:40])
              s = s.replace(a,b,1)

          # Fix report/Markdown separators to real newlines.
          s = s.replace("reportLines().join('\\\\n')", "reportLines().join('\\n')")
          s = s.replace("L.join('\\\\n')", "L.join('\\n')")

          # Restrained research-notebook visual layer.
          css = r'''
/* v2 visual polish */
:root{--accent:#2563eb;--accent2:#475569;--soft:#eff6ff;--radius:14px;--shadow:0 4px 18px rgba(15,23,42,.055)}
body{background:linear-gradient(180deg,#f8fafc 0,#f1f5f9 48%,#f8fafc 100%);letter-spacing:.005em}
.wrap{max-width:1040px;padding:28px 18px 80px}
.hero{border-radius:18px;padding:30px 32px;background:linear-gradient(135deg,#111827,#1e293b 70%,#334155);box-shadow:0 14px 34px rgba(15,23,42,.12)}
.hero p{max-width:760px;color:#dbe4ee}.notice{border-color:#ffffff1f;background:#ffffff0b}
.toolbar{top:6px;padding:8px 0;background:#f8fafce8}
.btn{border-radius:8px;font-weight:650}.btn.primary{box-shadow:0 3px 10px #2563eb22}.btn:hover{transform:translateY(-1px)}
.progress,.section{border-radius:14px;box-shadow:0 3px 16px rgba(15,23,42,.045)}
.section{margin:11px 0}.section summary{padding:15px 17px;font-size:16px}.body{padding:0 17px 19px}
.num{font-weight:750;background:#eaf1ff;color:#1d4ed8}.record{border-radius:11px;padding:14px;border-color:#dfe4eb}.record:hover{border-color:#c7d2e0;box-shadow:0 5px 16px #0f172a0b}
.tag{background:#f1f5f9;color:#475569}.editgrid{gap:10px}.editgrid label{color:#64748b;font-weight:600}
.editgrid input,.editgrid textarea,.field textarea,.note,.ai-box textarea{border-radius:9px;outline:none;transition:.15s}
.editgrid input:focus,.editgrid textarea:focus,.field textarea:focus,.note:focus,.ai-box textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #3b82f61a}
.empty{background:#f8fafc;border-color:#cbd5e1}.oauth-guide{border-color:#d7e1f5;background:#f8fbff;border-radius:12px}.ai-box{border-color:#dbe4f5;background:linear-gradient(135deg,#f8fbff,#f8f8ff);border-radius:13px}
.ai-box strong{color:#1e3a8a}.report{border-radius:11px}
@media(prefers-color-scheme:dark){body{background:linear-gradient(180deg,#0b1020,#0d1117 55%,#0b1020)}:root{--accent:#60a5fa;--accent2:#94a3b8;--soft:#172554}.toolbar{background:#0d1117e8}.hero{box-shadow:0 14px 34px #0005}.record{border-color:#303846}.record:hover{border-color:#465164}.num{background:#172554;color:#93c5fd}.tag{background:#222934;color:#cbd5e1}.empty{background:#11161d;border-color:#3b4554}.oauth-guide{background:#101827;border-color:#293c59}.ai-box{background:linear-gradient(135deg,#111a2b,#171827);border-color:#303a59}.ai-box strong{color:#bfdbfe}}
@media(max-width:700px){.wrap{padding:14px 11px 55px}.hero{padding:24px 18px;border-radius:16px}.toolbar{top:0}.toolbar .btn{min-height:40px}.section summary{padding:14px}.body{padding:0 13px 17px}}
'''
          if '/* v2 visual polish */' not in s:
              marker='</style>'
              if marker not in s: raise SystemExit('style marker missing')
              s=s.replace(marker,css+marker,1)

          if s == old:
              raise SystemExit('No changes made')

          p.write_text(s,encoding='utf-8')
          # Lightweight structural checks; no nested shell quoting.
          assert s.count('<script>') == s.count('</script>') == 1
          assert s.count('<style>') == s.count('</style>') == 1
          assert s.count('function addOAuth') == 1
          assert s.count('function addTimeline') == 1
          assert s.count('function addEvidence') == 1
          assert 'function update(){' in s
          assert 'function buildAIPrompt(){' in s
          assert "reportLines().join('\\n')" in s

          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','index.html'],check=True)
          subprocess.run(['git','commit','-m','fix: stabilize record adding and polish UI [skip ci]'],check=True)
          subprocess.run(['git','push'],check=True)
      - name: Remove repair workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-and-polish.yml
          git commit -m "chore: remove temporary repair workflow [skip ci]"
          git push
