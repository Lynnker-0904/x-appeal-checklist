name: Fix AI helper
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ai-helper.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated text line breaks
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          bad="L.join('\\\n')"
          s=s.replace(bad, "L.join('\\n')")
          if s==old:
            raise SystemExit('No broken line-join pattern found')
          p.write_text(s,encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','index.html'],check=True)
          subprocess.run(['git','commit','-m','fix: restore generated report line breaks [skip ci]'],check=True)
          subprocess.run(['git','push'],check=True)
          PY
