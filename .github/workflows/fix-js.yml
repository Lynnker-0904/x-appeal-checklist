name: Fix JS syntax
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-js.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"function update\(\)\{.*?\}\nfunction toggleAll"
          replacement="""function update(){
            let total=0,done=0;
            sections.forEach((sec,si)=>sec[3].forEach((_,ii)=>{
              total++;
              if(document.querySelector(`input[name=\"s${si}_${ii}\"]:checked`)) done++;
            }));
            appealItems.forEach((_,i)=>{
              total++;
              const el=document.getElementById(`a${i}`);
              if(el && el.checked) done++;
            });
            const pct=total?Math.round(done/total*100):0;
            document.getElementById('pct').textContent=`${pct}% · ${done} / ${total}`;
            document.getElementById('fill').style.width=pct+'%';
            document.getElementById('status').textContent=pct===0?'🟢 尚未开始':pct<50?'🟡 正在调查':pct<100?'🔵 基本完成，还需补充':'🟢 自查完成，可整理申诉';
            persist();
          }
          function toggleAll"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('update() not found')
          s=s.replace("join('\\\n')","join('\\n')")
          p.write_text(s,encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: simplify checklist runtime and restore buttons [skip ci]'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-js.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/fix-js.yml
          git commit -m 'chore: remove temporary JS fixer [skip ci]' || true
          git push || true
