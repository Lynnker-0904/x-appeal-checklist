<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X Appeal Pre-Check</title><style>:root{--bg:#f5f6f8;--card:#fff;--text:#17191d;--muted:#68707d;--line:#dfe3e8;--blue:#2563eb;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 "Noto Serif CJK SC","Source Han Serif SC","思源宋体","Songti SC","STSong","SimSun",serif}.wrap{max-width:860px;margin:auto;padding:26px 14px 50px}h1{margin:0 0 4px;font-size:27px}.lang{float:right}.warn{margin:14px 0;padding:10px 12px;border-left:3px solid var(--blue);background:#eef4ff;border-radius:6px;font-size:13px;color:#334155}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 11px;border-radius:6px;cursor:pointer;font:inherit;touch-action:manipulation}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{color:var(--danger)}.progress,.card{background:var(--card);border:1px solid var(--line);border-radius:9px}.progress{padding:12px;margin-bottom:12px}.progressline{display:flex;justify-content:space-between;font-size:13px}.bar{height:6px;background:#edf0f3;border-radius:5px;margin-top:7px;overflow:hidden}.fill{height:100%;width:0;background:var(--blue);transition:width .18s}.card{margin:10px 0}.card summary{cursor:pointer;padding:13px 14px;font-weight:700}.body{padding:0 14px 15px}.desc{color:var(--muted);font-size:13px}.check{padding:10px 0;border-top:1px solid var(--line)}.check b{display:block;margin-bottom:7px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{position:relative;display:flex;align-items:center;justify-content:center;min-height:42px;padding:8px 6px;border:1px solid var(--line);border-radius:7px;cursor:pointer;text-align:center}.choice input{position:absolute;opacity:0}.choice:has(input:checked){border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);background:#eef4ff;color:var(--blue);font-weight:600}.note{width:100%;margin-top:7px;padding:7px;border:1px solid var(--line);border-radius:5px;font:inherit}.records{display:grid;gap:7px;margin-top:9px}.record{border:1px solid var(--line);border-radius:7px;padding:10px}.recordhead{display:flex;justify-content:space-between;gap:8px}.actions,.editactions{display:flex;gap:5px}.small{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid label{font-size:12px;color:var(--muted)}.grid input,.grid textarea,.appeal{width:100%;margin-top:3px;padding:7px;border:1px solid var(--line);border-radius:5px;font:inherit;color:var(--text);background:var(--card)}.full{grid-column:1/-1}.editactions{justify-content:flex-end;margin-top:8px}.empty{text-align:center;padding:12px;border:1px dashed var(--line);border-radius:7px;color:var(--muted)}.appeal{min-height:120px}.report{white-space:pre-wrap;background:#111827;color:#e5e7eb;border-radius:7px;padding:12px;font:12px/1.6 ui-monospace,monospace;overflow:auto}.next{margin-top:10px;padding:10px 12px;background:#f0f7ff;border:1px solid #cfe0ff;border-radius:7px;font-size:13px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}@media(max-width:620px){.wrap{padding:20px 10px 40px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar .btn{flex:1}.choices{gap:6px}.choice{min-height:46px;padding:9px 4px}}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--line:#30363d;--blue:#58a6ff;--danger:#ff7b72}.warn{background:#172338;color:#c9d1d9}.bar{background:#30363d}.next{background:#172338;border-color:#274472}.choice:has(input:checked){background:#172338}}</style></head><body><div class="wrap"><header><button class="btn lang" id="langBtn" onclick="toggleLang()">English</button><h1 id="title"></h1><p id="subtitle"></p><div class="warn" id="warn"></div></header><div class="toolbar"><button class="btn" id="expand" onclick="details(true)"></button><button class="btn" id="collapse" onclick="details(false)"></button><button class="btn" id="export" onclick="exportData()"></button><button class="btn primary" id="make" onclick="makeReport()"></button><button class="btn danger" id="reset" onclick="resetData()"></button></div><div class="progress"><div class="progressline"><span id="progressLabel"></span><span id="pct">0%</span></div><div class="bar"><div id="fill" class="fill"></div></div></div><div id="checks"></div><section class="card"><details open><summary id="oauthTitle"></summary><div class="body"><p class="desc" id="oauthDesc"></p><button class="btn primary" id="addOAuth" onclick="add('oauth')"></button><div id="oauth" class="records"></div></div></details></section><section class="card"><details open><summary id="timelineTitle"></summary><div class="body"><p class="desc" id="timelineDesc"></p><button class="btn primary" id="addTimeline" onclick="add('timeline')"></button><div id="timeline" class="records"></div></div></details></section><section class="card"><details open><summary id="evidenceTitle"></summary><div class="body"><p class="desc" id="evidenceDesc"></p><button class="btn primary" id="addEvidence" onclick="add('evidence')"></button><div id="evidence" class="records"></div></div></details></section><section class="card"><details open><summary id="appealTitle"></summary><div class="body"><p class="desc" id="appealDesc"></p><div id="appealChecks"></div><textarea id="appeal" class="appeal" oninput="state.appealText=this.value;saveSoon()"></textarea></div></details></section><section class="card"><details id="reportDetails"><summary id="reportTitle"></summary><div class="body"><p class="desc" id="reportDesc"></p><button class="btn primary" id="copy" onclick="copyReport()"></button><pre id="report" class="report"></pre><div id="nextStep" class="next" hidden></div></div></details></section><div class="footer" id="footer"></div></div><script>
const I={zh:{title:'X 账号申诉前自查表',subtitle:'先把事实、时间线和证据整理清楚，再写申诉。',warn:'非 X 官方工具。OAuth 授权、时间接近或第三方应用存在，都不能单独证明它导致封禁。请区分事实、异常信号和推测。',expand:'展开',collapse:'折叠',export:'导出 JSON',make:'整理可复制材料',reset:'重置本次调查',progress:'完成度',oauth:'OAuth 授权记录',oauthDesc:'记录你看到的第三方应用。权限不是行为证据。',addOAuth:'＋ 添加应用',timeline:'事件时间线',timelineDesc:'记录通知、授权、登录、异常行为和安全处置。',addTimeline:'＋ 添加时间点',evidence:'证据台账',evidenceDesc:'可以反复添加证据。每发现一份新截图、邮件、日志或记录，就单独建立一条。',addEvidence:'＋ 添加证据',appeal:'申诉材料',appealDesc:'这里不是让你直接写一封“漂亮的申诉信”，而是确认申诉前的信息是否整理完整。',appealPlaceholder:'补充你希望平台复核的事项、已经采取的安全措施等。',report:'整理结果 · 可复制材料',reportDesc:'把上面的调查结果整理成一份可以直接交给 AI 继续讨论的材料。补充新证据后，可以重新生成。',copy:'复制全部材料',notGenerated:'尚未生成。点击上方“整理可复制材料”。',next:'下一步\n把刚才复制的材料交给 AI，和 AI 一起核对事实、补充遗漏、区分事实与推测；确认材料可靠后，再让 AI 帮你整理成正式的申诉信。不要让 AI 凭空补充你没有证据支持的事实。',footer:'Offline-first · 无登录 · 无后端 · 数据只保存在本浏览器',yes:'有',no:'没有',unknown:'未知 / 尚未核实',note:'备注（可选）',empty:'还没有记录。',save:'保存',cancel:'取消',name:'名称',developer:'开发者',date:'日期',permission:'权限',known:'是否认识',used:'是否实际使用',revoked:'是否已撤销',remarks:'备注',type:'类型',source:'来源',detail:'详情',location:'保存位置',event:'对应事件',unnamedEvent:'未命名事件',confirmReset:'确定重置本次调查吗？所有当前自查、OAuth、时间线、证据和申诉材料都会被清空。建议先导出 JSON 备份。',needTitle:'请填写标题。',needName:'请填写名称。',copied:'已复制全部材料。'},en:{title:'X Appeal Pre-Check',subtitle:'Organize the facts, timeline, and evidence before writing an appeal.',warn:'Not an official X tool. OAuth authorization, timing, or the presence of a third-party app alone does not prove causation. Separate facts, signals, and speculation.',expand:'Expand',collapse:'Collapse',export:'Export JSON',make:'Build copy-ready materials',reset:'Reset investigation',progress:'Progress',oauth:'OAuth / Connected Apps',oauthDesc:'Record third-party apps you find. Permission scope is not evidence of actual behavior.',addOAuth:'＋ Add app',timeline:'Event Timeline',timelineDesc:'Record notices, authorizations, logins, anomalies, and security actions.',addTimeline:'＋ Add event',evidence:'Evidence Log',evidenceDesc:'Add evidence repeatedly. Give each screenshot, email, log, or record its own entry.',addEvidence:'＋ Add evidence',appeal:'Appeal Preparation',appealDesc:'This section is for checking whether your investigation is ready, not for writing a polished appeal yet.',appealPlaceholder:'Add anything you want X to review, plus security steps you have actually taken.',report:'Prepared Materials · Copy',reportDesc:'Turn the investigation into material you can give to an AI for a second review. Regenerate after adding new evidence.',copy:'Copy all materials',notGenerated:'Not generated yet. Click “Build copy-ready materials”.',next:'Next step\nGive the copied material to an AI and review the facts, missing pieces, and fact-vs-speculation boundary together. Once the material is reliable, ask the AI to help draft the formal appeal. Do not let AI invent unsupported facts.',footer:'Offline-first · No login · No backend · Data stays in this browser',yes:'Yes',no:'No',unknown:'Unknown / Not verified yet',note:'Notes (optional)',empty:'No records yet.',save:'Save',cancel:'Cancel',name:'Name',developer:'Developer',date:'Date',permission:'Permission',known:'Recognized?',used:'Actually used?',revoked:'Revoked?',remarks:'Notes',type:'Type',source:'Source',detail:'Details',location:'Storage / location',event:'Related event',unnamedEvent:'Untitled event',confirmReset:'Reset this investigation? All current checks, OAuth records, timeline, evidence, and appeal material will be cleared. Export JSON first if you want a backup.',needTitle:'Please enter a title.',needName:'Please enter a name.',copied:'All materials copied.'}};
const G={zh:{account:['账号基础',['修改过用户名/头像/简介','修改过邮箱或手机号','出现陌生登录地点或设备','出现自己没有进行过的账号行为']],oauth:['OAuth / 第三方应用',['查看过已连接的应用','存在不认识的应用','存在不再使用但仍授权的应用','存在 Read & Write 权限','授权时间与异常事件接近']],activity:['异常行为',['短时间大量关注/取关','短时间大量点赞/转发','短时间大量发帖','重复发布相似内容','使用自动化工具、脚本或 API','出现无法解释的账号行为']],security:['安全处置',['修改密码','开启双因素认证','检查登录活动和会话','撤销陌生或不再使用的应用','确认邮箱和手机号安全']],evidence:['证据保存',['保存 X 通知或邮件','保存登录记录','保存 OAuth 授权记录','保存关键截图','建立证据与事件的对应关系']]},en:{account:['Account basics',['Changed username, avatar, or bio','Changed email or phone number','Unrecognized login location or device','Account activity I did not perform']],oauth:['OAuth / Connected apps',['Reviewed connected apps','Unrecognized app exists','Unused app is still authorized','Read & Write permission exists','Authorization is close in time to an anomaly']],activity:['Activity anomalies',['Large number of follows/unfollows in a short period','Large number of likes/reposts in a short period','Large number of posts in a short period','Repeated or near-identical posts','Automation tools, scripts, or API use','Unexplained account activity']],security:['Security actions',['Changed password','Enabled two-factor authentication','Reviewed login activity and sessions','Revoked unfamiliar or unused apps','Confirmed email and phone security']],evidence:['Evidence saved',['Saved X notices or emails','Saved login records','Saved OAuth authorization records','Saved key screenshots','Linked evidence to events']]}};
const appealItems={zh:['已确认账号基本信息','已检查 OAuth 应用','已检查账号安全','已整理异常行为','已建立时间线','已保存关键证据','已记录安全处置','没有把推测写成事实','申诉说明简洁且基于事实'],en:['Confirmed basic account information','Reviewed connected apps / OAuth','Reviewed account security','Reviewed activity anomalies','Built a timeline','Saved key evidence','Recorded security actions','Did not present speculation as fact','Appeal explanation is concise and fact-based']};
const groups=['account','oauth','activity','security','evidence'],key='xAppealChecklist.simple.v2';let lang=localStorage.getItem('xAppealChecklist.lang')||((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en');function blank(){return{checks:{},notes:{},oauth:[],timeline:[],evidence:[],appeal:{},appealText:''}}let state=blank();try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&typeof x==='object')state=Object.assign(blank(),x)}catch(e){}let timer=0;function T(){return I[lang]}function saveNow(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function saveSoon(){clearTimeout(timer);timer=setTimeout(saveNow,180)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyLang(){const t=T(),map={title:'title',subtitle:'subtitle',warn:'warn',expand:'expand',collapse:'collapse',export:'export',make:'make',reset:'reset',progressLabel:'progress',oauthTitle:'oauth',oauthDesc:'oauthDesc',addOAuth:'addOAuth',timelineTitle:'timeline',timelineDesc:'timelineDesc',addTimeline:'addTimeline',evidenceTitle:'evidence',evidenceDesc:'evidenceDesc',addEvidence:'addEvidence',appealTitle:'appeal',appealDesc:'appealDesc',reportTitle:'report',reportDesc:'reportDesc',copy:'copy',footer:'footer'};Object.keys(map).forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=t[map[id]]});document.getElementById('langBtn').textContent=lang==='zh'?'English':'中文';document.getElementById('appeal').placeholder=t.appealPlaceholder;document.getElementById('report').textContent=t.notGenerated;renderChecks();renderRecords();progress()}
function toggleLang(){lang=lang==='zh'?'en':'zh';localStorage.setItem('xAppealChecklist.lang',lang);applyLang()}
function renderChecks(){let html='';groups.forEach((g,gi)=>{const d=G[lang][g];html+='<section class="card"><details><summary>'+d[0]+'</summary><div class="body">';d[1].forEach((item,i)=>{const k=gi+'-'+i,v=state.checks[k]||'';html+='<div class="check"><b>'+esc(item)+'</b><div class="choices">';[['yes',T().yes],['no',T().no],['unknown',T().unknown]].forEach(([val,text])=>{html+='<label class="choice"><input type="radio" name="c'+k+'" '+(v===val?'checked ':'')+'onchange="setCheck(\''+k+'\',\''+val+'\')"><span>'+text+'</span></label>'});html+='</div><input class="note" value="'+esc(state.notes[k]||'')+'" placeholder="'+esc(T().note)+'" oninput="state.notes[\''+k+'\']=this.value;saveSoon()"></div>'});html+='</div></details></section>'});document.getElementById('checks').innerHTML=html;let a='';appealItems[lang].forEach((x,i)=>a+='<div class="check"><label><input type="checkbox" '+(state.appeal[i]?'checked':'')+' onchange="state.appeal['+i+']=this.checked;saveNow();progress()"> '+x+'</label></div>');document.getElementById('appealChecks').innerHTML=a;document.getElementById('appeal').value=state.appealText||''}
function setCheck(k,v){state.checks[k]=v;saveNow();progress()}
function add(type){const x=type==='oauth'?{name:'',dev:'',date:'',permission:'',known:'',used:'',revoked:'',note:''}:type==='timeline'?{date:'',title:'',type:'',detail:'',source:''}:{name:'',type:'',location:'',event:'',note:''};state[type].push(x);saveNow();renderRecords();openEditor(type,state[type].length-1)}
function inp(label,name,value,type){return '<label>'+label+'<input type="'+(type||'text')+'" data-k="'+name+'" value="'+esc(value)+'"></label>'}function area(label,name,value){return '<label class="full">'+label+'<textarea data-k="'+name+'">'+esc(value)+'</textarea></label>'}
function editor(type,i){const x=state[type][i],t=T();let h='';if(type==='oauth')h=inp(t.name,'name',x.name)+inp(t.developer,'dev',x.dev)+inp(t.date,'date',x.date,'date')+inp(t.permission,'permission',x.permission)+inp(t.known,'known',x.known)+inp(t.used,'used',x.used)+inp(t.revoked,'revoked',x.revoked)+area(t.remarks,'note',x.note);else if(type==='timeline')h=inp(t.date,'date',x.date,'date')+inp(t.name,'title',x.title)+inp(t.type,'type',x.type)+inp(t.source,'source',x.source)+area(t.detail,'detail',x.detail);else h=inp(t.name,'name',x.name)+inp(t.type,'type',x.type)+inp(t.location,'location',x.location)+inp(t.event,'event',x.event)+area(t.remarks,'note',x.note);return '<div class="record"><div class="grid">'+h+'</div><div class="editactions"><button class="btn primary" onclick="commit(\''+type+'\','+i+',this)">'+t.save+'</button><button class="btn" onclick="renderRecords()">'+t.cancel+'</button></div></div>'}
function openEditor(type,i){const box=document.getElementById(type);const holder=document.createElement('div');holder.innerHTML=editor(type,i);box.appendChild(holder.firstElementChild)}function commit(type,i,btn){const obj={};btn.closest('.record').querySelectorAll('[data-k]').forEach(e=>obj[e.dataset.k]=e.value);if(!(type==='timeline'?obj.title:obj.name).trim()){alert(type==='timeline'?T().needTitle:T().needName);return}state[type][i]=obj;saveNow();renderRecords()}
function renderRecords(){['oauth','timeline','evidence'].forEach(type=>{const box=document.getElementById(type);if(!state[type].length){box.innerHTML='<div class="empty">'+T().empty+'</div>';return}box.innerHTML=state[type].map((x,i)=>{let title=type==='timeline'?(x.title||T().unnamedEvent):(x.name||T().name),sub=type==='timeline'?(x.date||T().date):(type==='oauth'?(x.dev||T().developer):(x.type||T().type));return '<div class="record"><div class="recordhead"><div><b>'+esc(title)+'</b><div class="small">'+esc(sub)+'</div></div><div class="actions"><button class="btn" onclick="openEditor(\''+type+'\','+i+')">'+T().save+'</button><button class="btn danger" onclick="removeRecord(\''+type+'\','+i+')">×</button></div></div></div>'}).join('')})}function removeRecord(type,i){if(confirm(lang==='zh'?'确定删除这条记录吗？':'Delete this record?')){state[type].splice(i,1);saveNow();renderRecords()}}
function details(open){document.querySelectorAll('details').forEach(d=>d.open=open)}function progress(){const total=groups.reduce((n,g)=>n+G.zh[g][1].length,0),done=Object.values(state.checks).filter(Boolean).length,pct=Math.round(done/total*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%'}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='x-appeal-investigation.json';a.click();URL.revokeObjectURL(a.href)}
function makeReport(){const L=[];L.push(T().title);L.push('='.repeat(30));L.push(T().progress+': '+document.getElementById('pct').textContent);L.push('');L.push(lang==='zh'?'自查状态':'CHECKLIST');groups.forEach((g,gi)=>{const d=G[lang][g];L.push('['+d[0]+']');d[1].forEach((item,i)=>{const k=gi+'-'+i;L.push('- '+item+': '+(state.checks[k]||T().unknown)+(state.notes[k]?' | '+state.notes[k]:''))})});L.push('');L.push(lang==='zh'?'OAuth 记录':'OAUTH RECORDS');state.oauth.forEach(x=>L.push('- '+[x.name,x.dev,x.date,x.permission].filter(Boolean).join(' | ')));L.push('');L.push(lang==='zh'?'事件时间线':'TIMELINE');state.timeline.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(x=>L.push('- '+[x.date,x.title,x.type,x.detail,x.source].filter(Boolean).join(' | ')));L.push('');L.push(lang==='zh'?'证据':'EVIDENCE');state.evidence.forEach(x=>L.push('- '+[x.name,x.type,x.location,x.event,x.note].filter(Boolean).join(' | ')));L.push('');L.push(lang==='zh'?'申诉准备检查':'APPEAL PREPARATION');appealItems[lang].forEach((x,i)=>L.push('- ['+(state.appeal[i]?'x':' ')+'] '+x));L.push('');L.push(lang==='zh'?'补充说明':'ADDITIONAL NOTES');L.push(state.appealText||'');const out=L.join('\n');document.getElementById('report').textContent=out;document.getElementById('reportDetails').open=true;const n=document.getElementById('nextStep');n.hidden=false;const parts=T().next.split('\n');n.innerHTML='<b>'+parts[0]+'</b><br>'+parts.slice(1).join('<br>');return out}
async function copyReport(){const text=makeReport();try{await navigator.clipboard.writeText(text);alert(T().copied)}catch(e){alert(text)}}function resetData(){if(!confirm(T().confirmReset))return;state=blank();saveNow();renderChecks();renderRecords();progress();document.getElementById('report').textContent=T().notGenerated;document.getElementById('nextStep').hidden=true}applyLang();
</script></body></html>
