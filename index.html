<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X 账号申诉前自查表</title></head><body><div id="app"></div><script>const appealItems=['已确认账号基本信息','已检查 OAuth 应用','已检查账号安全','已整理异常行为','已建立时间线','已保存关键证据','已记录安全处置','没有把推测写成事实','申诉说明简洁且基于事实'];const groups=[['账号基础',['修改过用户名/头像/简介','修改过邮箱或手机号','出现陌生登录地点或设备','出现自己没有进行过的账号行为']],['OAuth / 第三方应用',['查看过已连接的应用','存在不认识的应用','存在不再使用但仍授权的应用','存在 Read & Write 权限','授权时间与异常事件接近']],['异常行为',['短时间大量关注/取关','短时间大量点赞/转发','短时间大量发帖','重复发布相似内容','使用自动化工具、脚本或 API','出现无法解释的账号行为']],['安全处置',['修改密码','开启双因素认证','检查登录活动和会话','撤销陌生或不再使用的应用','确认邮箱和手机号安全']],['证据保存',['保存 X 通知或邮件','保存登录记录','保存 OAuth 授权记录','保存关键截图','建立证据与事件的对应关系']]];const key='xAppealChecklist.simple.v2';let state={checks:{},notes:{},oauth:[],timeline:[],evidence:[],appeal:{},appealText:''};try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&typeof x==='object')state=Object.assign(state,x)}catch(e){}function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let h='<h1>X 账号申诉前自查表</h1><p>先把事实、时间线和证据整理清楚，再写申诉。</p>';groups.forEach((g,gi)=>{h+='<section><h2>'+g[0]+'</h2>';g[1].forEach((item,i)=>{const k=gi+'-'+i;h+='<div><b>'+esc(item)+'</b><br><label><input type="radio" name="c'+k+'" '+(state.checks[k]==='有'?'checked':'')+' onchange="setCheck(\''+k+'\',\'有\')"> 有</label> <label><input type="radio" name="c'+k+'" '+(state.checks[k]==='没有'?'checked':'')+' onchange="setCheck(\''+k+'\',\'没有\')"> 没有</label> <label><input type="radio" name="c'+k+'" '+(state.checks[k]==='未知'?'checked':'')+' onchange="setCheck(\''+k+'\',\'未知\')"> 未知 / 尚未核实</label><br><input value="'+esc(state.notes[k]||'')+'" placeholder="备注（可选）" oninput="state.notes[\''+k+'\']=this.value;save()"></div>'}) ;h+='</section>'});h+='<section><h2>申诉材料</h2><div id="appealChecks">';appealItems.forEach((x,i)=>{h+='<div><label><input type="checkbox" '+(state.appeal[i]?'checked':'')+' onchange="state.appeal['+i+']=this.checked;save()"> '+x+'</label></div>'});h+='</div><textarea id="appeal" placeholder="补充你希望平台复核的事项、已经采取的安全措施等。">'+esc(state.appealText)+'</textarea></section>';document.getElementById('app').innerHTML=h;document.getElementById('appeal').oninput=e=>{state.appealText=e.target.value;save()}}function setCheck(k,v){state.checks[k]=v;save();render()}render();</script></body></html>
