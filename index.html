<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X 账号申诉前自查表</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#17191d;--muted:#68707d;--line:#e1e5ea;--blue:#2563eb;--blue-soft:#eff6ff;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 16px 60px}
header{margin-bottom:22px}h1{font-size:28px;margin:0 0 5px}header p{margin:0;color:var(--muted)}.warning{margin-top:14px;padding:11px 13px;background:var(--blue-soft);border-left:3px solid var(--blue);border-radius:7px;color:#334155;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 12px;border-radius:7px;cursor:pointer;font:inherit}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:12px 0}.card>summary{cursor:pointer;padding:14px 16px;font-weight:700}.body{padding:0 16px 18px}.desc{color:var(--muted);font-size:13px}.check{padding:9px 0;border-top:1px solid var(--line)}.check label{display:block}.note{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.records{display:grid;gap:8px;margin-top:10px}.record{border:1px solid var(--line);border-radius:8px;padding:11px}.recordhead{display:flex;justify-content:space-between;gap:8px}.small{font-size:12px;color:var(--muted)}.recordactions{display:flex;gap:5px}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.editgrid label{font-size:13px;color:var(--muted)}.editgrid input,.editgrid textarea{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit;color:var(--text);background:var(--card)}.full{grid-column:1/-1}.editactions{display:flex;justify-content:flex-end;gap:6px;margin-top:9px}.empty{padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
.progress{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:14px}.progressline{display:flex;justify-content:space-between;font-size:13px}.bar{height:7px;background:#edf0f3;border-radius:9px;margin-top:8px;overflow:hidden}.fill{height:100%;background:var(--blue);width:0}
textarea.appeal{width:100%;min-height:130px;border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit}.report{white-space:pre-wrap;background:#111827;color:#e5e7eb;border-radius:8px;padding:13px;font:12px/1.6 ui-monospace,monospace;max-height:500px;overflow:auto}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
@media(max-width:650px){.wrap{padding:20px 11px 45px}.editgrid{grid-template-columns:1fr}.full{grid-column:auto}.recordhead{display:block}.recordactions{margin-top:7px}.toolbar .btn{flex:1}.card>summary{padding:13px}.body{padding:0 13px 16px}}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--line:#30363d;--blue:#58a6ff;--blue-soft:#172338;--danger:#ff7b72}.btn{background:var(--card);color:var(--text)}.progress{background:var(--card)}.warning{color:#c9d1d9}.bar{background:#30363d}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>X 账号申诉前自查表</h1><p>先把事实、时间线和证据整理清楚，再写申诉。</p><div class="warning">非 X 官方工具。OAuth 授权、时间接近或第三方应用存在，都不能单独证明它导致封禁。请区分事实、异常信号和推测。</div></header>
<div class="toolbar"><button class="btn" onclick="allDetails(true)">展开</button><button class="btn" onclick="allDetails(false)">折叠</button><button class="btn" onclick="exportJSON()">导出 JSON</button><button class="btn primary" onclick="makeReport()">生成报告</button><button class="btn danger" onclick="clearAll()">清空</button></div>
<div class="progress"><div class="progressline"><span>完成度</span><span id="pct">0%</span></div><div class="bar"><div id="fill" class="fill"></div></div></div>
<div id="checks"></div>
<section class="card"><details open><summary>OAuth 授权记录</summary><div class="body"><p class="desc">记录你看到的第三方应用。权限不是行为证据。</p><button class="btn primary" onclick="addRecord('oauth')">＋ 添加应用</button><div id="oauthList" class="records"></div></div></details></section>
<section class="card"><details open><summary>事件时间线</summary><div class="body"><p class="desc">按时间记录通知、授权、登录、异常行为和安全处置。</p><button class="btn primary" onclick="addRecord('timeline')">＋ 添加时间点</button><div id="timelineList" class="records"></div></div></details></section>
<section class="card"><details open><summary>证据台账</summary><div class="body"><p class="desc">记录证据是什么、保存在哪里、对应哪个事件。</p><button class="btn primary" onclick="addRecord('evidence')">＋ 添加证据</button><div id="evidenceList" class="records"></div></div></details></section>
<section class="card"><details open><summary>申诉材料</summary><div class="body"><div id="appealChecks"></div><textarea id="appeal" class="appeal" placeholder="简洁写下你的情况、已确认事实、安全处置和希望平台复核的事项。"></textarea></div></details></section>
<section class="card"><details><summary>自查报告</summary><div class="body"><button class="btn" onclick="copyReport()">复制报告</button><pre id="report" class="report">尚未生成。</pre></div></details></section>
<div class="footer">Offline-first · 无登录 · 无后端 · 数据只保存在本浏览器</div>
</div>
<script>
const sections=[
 ['账号基础',['修改过用户名/头像/简介','修改过邮箱或手机号','出现陌生登录地点或设备','出现自己没有进行过的账号行为']],
 ['OAuth / 第三方应用',['查看过已连接的应用','存在不认识的应用','存在不再使用但仍授权的应用','存在 Read & Write 权限','授权时间与异常事件接近']],
 ['异常行为',['短时间大量关注/取关','短时间大量点赞/转发','短时间大量发帖','重复发布相似内容','使用自动化工具、脚本或 API','出现无法解释的账号行为']],
 ['安全处置',['修改密码','开启双因素认证','检查登录活动和会话','撤销陌生或不再使用的应用','确认邮箱和手机号安全']],
 ['证据保存',['保存 X 通知或邮件','保存登录记录','保存 OAuth 授权记录','保存关键截图','建立证据与事件的对应关系']]
];
const appealItems=['已确认账号基本信息','已检查 OAuth 应用','已检查账号安全','已整理异常行为','已建立时间线','已保存关键证据','已记录安全处置','没有把推测写成事实','申诉说明简洁且基于事实'];
const key='xAppealChecklist.simple.v1';
let data={oauth:[],timeline:[],evidence:[],states:{},notes:{},appeal:{}};
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&typeof saved==='object')data={...data,...saved}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderChecks(){document.getElementById('checks').innerHTML=sections.map((s,si)=>`<section class="card"><details><summary>${s[0]}</summary><div class="body">${s[1].map((x,ii)=>{const k=si+'-'+ii;return `<div class="check"><label><input type="radio" name="c${k}" value="已确认" ${data.states[k]==='已确认'?'checked':''} onchange="setState('${k}',this.value)"> 已确认　<input type="radio" name="c${k}" value="需要调查" ${data.states[k]==='需要调查'?'checked':''} onchange="setState('${k}',this.value)"> 需要调查　<input type="radio" name="c${k}" value="未知" ${data.states[k]==='未知'?'checked':''} onchange="setState('${k}',this.value)"> 未知</label><div>${esc(x)}</div><input class="note" value="${esc(data.notes[k]||'')}" placeholder="备注（可选）" oninput="setNote('${k}',this.value)"></div>`}).join('')}</div></details></section>`).join('');document.getElementById('appealChecks').innerHTML=appealItems.map((x,i)=>`<div class="check"><label><input type="checkbox" ${data.appeal[i]?'checked':''} onchange="data.appeal[${i}]=this.checked;save();updateProgress()"> ${x}</label></div>`).join('')}
function setState(k,v){data.states[k]=v;save();updateProgress()}function setNote(k,v){data.notes[k]=v;save()}
function field(label,name,value,type='text',full=false){return `<label class="${full?'full':''}">${label}<input type="${type}" data-field="${name}" value="${esc(value)}"></label>`}function textField(label,name,value){return `<label class="full">${label}<textarea data-field="${name}">${esc(value)}</textarea></label>`}
function editRecord(type,i){const x=data[type][i];let html='';if(type==='oauth')html=[field('应用名称','name',x.name),field('开发者','dev',x.dev),field('授权日期','date',x.date,'date'),field('权限','permission',x.permission),field('是否认识','known',x.known),field('是否实际使用','used',x.used),field('是否已撤销','revoked',x.revoked),textField('备注','note',x.note)].join('');else if(type==='timeline')html=[field('日期','date',x.date,'date'),field('标题','title',x.title),field('类型','type',x.type),field('来源','source',x.source),textField('详情','detail',x.detail)].join('');else html=[field('证据名称','name',x.name),field('证据类型','type',x.type),field('保存位置','location',x.location),field('对应事件','event',x.event),textField('备注','note',x.note)].join('');return `<div class="record"><div class="editgrid">${html}</div><div class="editactions"><button class="btn primary" onclick="saveRecord('${type}',${i},this)">保存</button><button class="btn" onclick="renderRecords()">取消</button></div></div>`}
function addRecord(type){const blank=type==='oauth'?{name:'',dev:'',date:'',permission:'',known:'',used:'',revoked:'',note:''}:type==='timeline'?{date:'',title:'',type:'',detail:'',source:''}:{name:'',type:'',location:'',event:'',note:''};data[type].push(blank);save();renderRecords();editRecord(type,data[type].length-1)}
function saveRecord(type,i,btn){const root=btn.closest('.record'),obj={};root.querySelectorAll('[data-field]').forEach(el=>obj[el.dataset.field]=el.value);const required=type==='timeline'?obj.title:obj.name;if(!required.trim()){alert(type==='timeline'?'请填写标题。':'请填写名称。');return}data[type][i]=obj;save();renderRecords()}
function removeRecord(type,i){if(!confirm('确定删除这条记录吗？'))return;data[type].splice(i,1);save();renderRecords()}
function card(type,i,x){let title=type==='timeline'?(x.title||'未命名事件'):(x.name||type==='oauth'?'未命名应用':'未命名证据');let sub=type==='timeline'?(x.date||'日期未记录'):(type==='oauth'?(x.dev||'开发者未记录'):(x.type||'类型未记录'));return `<div class="record"><div class="recordhead"><div><b>${esc(title)}</b><div class="small">${esc(sub)}</div></div><div class="recordactions"><button class="btn" onclick="this.closest('.record').outerHTML=editRecord('${type}',${i})">编辑</button><button class="btn danger" onclick="removeRecord('${type}',${i})">删除</button></div></div></div>`}
function renderRecords(){['oauth','timeline','evidence'].forEach(type=>{const id=type==='oauth'?'oauthList':type==='timeline'?'timelineList':'evidenceList';const el=document.getElementById(id);if(!data[type].length){el.innerHTML='<div class="empty">还没有记录。</div>';return}el.innerHTML=data[type].map((x,i)=>card(type,i,x)).join('')})}
function updateProgress(){let total=0,done=0;sections.forEach((s,si)=>s[1].forEach((_,ii)=>{total++;if(data.states[si+'-'+ii])done++}));appealItems.forEach((_,i)=>{total++;if(data.appeal[i])done++});const pct=Math.round(done/total*100);document.getElementById('pct').textContent=pct+'%';document.getElementById('fill').style.width=pct+'%';save()}
function allDetails(open){document.querySelectorAll('details').forEach(d=>d.open=open)}
function reportText(){const L=['X 账号申诉前自查报告','生成时间：'+new Date().toLocaleString(),'','一、检查项'];sections.forEach((s,si)=>{L.push('【'+s[0]+'】');s[1].forEach((x,ii)=>L.push('- '+x+'：'+(data.states[si+'-'+ii]||'未填写')+(data.notes[si+'-'+ii]?'；备注：'+data.notes[si+'-'+ii]:'')))});L.push('','二、OAuth 授权记录');data.oauth.forEach((x,i)=>L.push((i+1)+'. '+(x.name||'未命名')+' | '+(x.dev||'')+' | '+(x.date||'')+' | 权限：'+(x.permission||'')+' | 已撤销：'+(x.revoked||'')));L.push('','三、事件时间线');data.timeline.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach((x,i)=>L.push((i+1)+'. '+(x.date||'')+' | '+(x.title||'')+' | '+(x.type||'')+' | '+(x.detail||'')+' | '+(x.source||'')));L.push('','四、证据台账');data.evidence.forEach((x,i)=>L.push((i+1)+'. '+(x.name||'')+' | '+(x.type||'')+' | '+(x.location||'')+' | '+(x.event||'')));L.push('','五、申诉材料准备');appealItems.forEach((x,i)=>L.push('- '+x+'：'+(data.appeal[i]?'是':'否')));L.push('','六、申诉说明',document.getElementById('appeal').value||'未填写','','提示：本报告整理事实与调查线索，不证明第三方应用导致封禁。');return L.join('\n')}
function makeReport(){document.getElementById('report').textContent=reportText()}
function copyReport(){const t=reportText();navigator.clipboard?.writeText(t).then(()=>alert('报告已复制。')).catch(()=>{makeReport();alert('复制失败，请手动复制。')})}
function exportJSON(){const out={...data,appealText:document.getElementById('appeal').value};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='x-appeal-checklist.json';a.click();URL.revokeObjectURL(a.href)}
function clearAll(){if(confirm('确定清空本地数据吗？')){localStorage.removeItem(key);location.reload()}}
document.getElementById('appeal').value=data.appealText||'';document.getElementById('appeal').oninput=e=>{data.appealText=e.target.value;save()};renderChecks();renderRecords();updateProgress();
</script>
</body>
</html>
